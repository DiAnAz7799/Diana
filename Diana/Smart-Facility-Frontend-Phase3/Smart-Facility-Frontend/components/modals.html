<!--
  components/modals.html
  Global confirm/delete dialog, reused everywhere via
  data-modal-trigger="confirm-delete-modal" (see tables.html pattern in
  the pattern library). Page-specific modals (e.g. "Create Material
  Request") should be added directly inside that page's own markup,
  following this same .modal-backdrop / .modal structure.
-->
<div class="modal-backdrop" id="confirm-delete-modal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirm-delete-title">
    <div class="modal-head">
      <div class="modal-title" id="confirm-delete-title">تأكيد الحذف</div>
      <div class="modal-close" data-modal-close>
        <svg class="gi" width="16" height="16" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </div>
    </div>
    <p style="font-size:13.5px; color:var(--text-muted); line-height:1.7; margin:0;">
      هل أنت متأكد من رغبتك في حذف هذا العنصر؟ لا يمكن التراجع عن هذا الإجراء.
    </p>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-modal-close>إلغاء</button>
      <button class="btn btn-critical" type="button" id="confirm-delete-submit">حذف نهائيًا</button>
    </div>
  </div>
</div>

<div class="command-palette-backdrop">
  <div class="command-palette">
    <div class="command-palette-input">
      <svg class="gi" width="18" height="18" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.5-4.5"/></svg>
      <input type="text" placeholder="ابحث عن أي شيء في النظام…" autocomplete="off">
      <span class="command-palette-kbd">Esc</span>
    </div>
    <div class="command-palette-results"></div>
  </div>
</div>
