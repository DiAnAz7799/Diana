<!--
  components/buttons.html
  PATTERN LIBRARY — not meant to be fetched via include.js as a single block.
  Copy the markup you need directly into your page. All styling comes from
  .btn / .btn-primary / etc in assets/css/components.css — nothing here is
  page-specific, so there is nothing to "duplicate": every page referencing
  these classes shares one CSS definition.
-->

<section style="display:flex; flex-direction:column; gap:20px; padding:24px;">

  <div>
    <h3 class="text-h3" style="margin-bottom:10px;">Primary</h3>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn btn-primary">+ مشروع جديد</button>
      <button class="btn btn-primary" disabled>+ مشروع جديد</button>
      <button class="btn btn-primary is-loading">جارِ الحفظ</button>
    </div>
  </div>

  <div>
    <h3 class="text-h3" style="margin-bottom:10px;">Ghost</h3>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn btn-ghost">
        <svg class="gi" width="15" height="15" viewBox="0 0 24 24"><path d="M12 3v13m0 0l-4.5-4.5M12 16l4.5-4.5"/><path d="M4 20h16"/></svg>
        تصدير
      </button>
      <button class="btn btn-ghost" disabled>تصدير</button>
    </div>
  </div>

  <div>
    <h3 class="text-h3" style="margin-bottom:10px;">Accent / Critical</h3>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn btn-accent">تحليل ذكي</button>
      <button class="btn btn-critical">حذف</button>
    </div>
  </div>

  <div>
    <h3 class="text-h3" style="margin-bottom:10px;">Icon-only</h3>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn-icon" aria-label="الإشعارات">
        <svg class="gi" width="18" height="18" viewBox="0 0 24 24"><path d="M6 10a6 6 0 0 1 12 0v4l2 3H4l2-3v-4z"/></svg>
      </button>
    </div>
  </div>

</section>
