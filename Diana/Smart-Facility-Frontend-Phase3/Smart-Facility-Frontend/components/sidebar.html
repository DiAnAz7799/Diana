<!--
  components/sidebar.html
  Loaded via <div data-include="../../components/sidebar.html"></div>
  Nav items are rendered into [data-nav-container] by assets/js/sidebar.js,
  driven by assets/js/nav-config.js and <body data-role="..." data-active-page="...">.
  This file itself never changes per role — only the JS config does.
-->
<aside class="sidebar" id="sidebar">
  <div class="brand" style="display:flex; align-items:center; gap:12px; padding:6px 6px 22px; border-bottom:1px solid var(--border); margin-bottom:18px;">
    <svg width="34" height="34" viewBox="0 0 40 40" fill="none">
      <circle cx="20" cy="20" r="17" stroke="var(--border)" stroke-width="2.5"/>
      <path d="M20 3 A17 17 0 0 1 35.4 12.5" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M35.4 12.5 A17 17 0 0 1 33 30.5" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M33 30.5 A17 17 0 0 1 15 36.6" stroke="var(--success)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <rect x="14" y="15" width="12" height="11" rx="1.5" fill="var(--primary)" opacity="0.15"/>
      <rect x="16.5" y="17.5" width="3" height="3" fill="var(--primary)"/>
      <rect x="20.5" y="17.5" width="3" height="3" fill="var(--primary)"/>
      <rect x="16.5" y="21.5" width="3" height="3" fill="var(--accent)"/>
      <rect x="20.5" y="21.5" width="3" height="3" fill="var(--primary)"/>
    </svg>
    <div class="brand-text">
      <div style="font-family:var(--font-display); font-weight:800; font-size:15px; line-height:1.3; white-space:nowrap;">نُظم — دورة حياة المنشآت</div>
      <div style="font-size:11px; color:var(--text-faint); white-space:nowrap;">Smart Facility Lifecycle</div>
    </div>
  </div>

  <a href="../shared/profile.html" class="role-switch" style="display:flex; align-items:center; gap:10px; background:var(--surface-alt); border:1px solid var(--border); border-radius:var(--radius-md); padding:10px 12px; margin-bottom:18px; cursor:pointer;">
    <div class="avatar" data-role-avatar style="width:34px; height:34px; font-size:12px; border-radius:50%; background:linear-gradient(135deg,var(--primary),var(--accent)); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700;">—</div>
    <div class="role-text" style="overflow:hidden; white-space:nowrap;">
      <div data-role-name style="font-size:13px; font-weight:700;">—</div>
      <div data-role-label style="font-size:11px; color:var(--text-muted);">—</div>
    </div>
  </a>

  <nav data-nav-container><!-- populated by sidebar.js from nav-config.js --></nav>

  <button class="collapse-btn" data-sidebar-collapse
    style="margin-top:auto; align-self:flex-start; background:none; border:1px solid var(--border); border-radius:var(--radius-sm); width:32px; height:32px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-muted);">
    <svg class="gi" width="16" height="16" viewBox="0 0 24 24"><path d="M8 5l-6 7 6 7M16 5l6 7-6 7"/></svg>
  </button>
</aside>

<style>
  .nav-item:hover{ background: var(--surface-alt); color: var(--text); }
  .nav-item.active{ background: var(--primary-tint); color: var(--primary-dark); font-weight: 700; }
  .nav-item.active svg.gi{ stroke: var(--primary-dark); }
  .sidebar.is-collapsed .brand-text,
  .sidebar.is-collapsed .role-text,
  .sidebar.is-collapsed .nav-title,
  .sidebar.is-collapsed .nav-item .lbl{ display: none; }
  .sidebar.is-collapsed .nav-item{ justify-content: center; }
  .sidebar.is-collapsed .role-switch{ justify-content: center; padding: 10px; }
  .nav-group{ margin-bottom: 14px; }
  .nav-title{ font-size: 11px; color: var(--text-faint); font-weight: 600; padding: 0 10px; margin-bottom: 6px; white-space: nowrap; overflow: hidden; }
  .nav-item{ display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--radius-sm); color: var(--text-muted); font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-decoration: none; transition: background var(--duration-fast), color var(--duration-fast); }
  .nav-item .ic{ flex-shrink: 0; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
</style>
