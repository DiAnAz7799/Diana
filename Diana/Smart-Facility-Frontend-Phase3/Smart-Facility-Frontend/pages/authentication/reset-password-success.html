<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>تم تغيير كلمة المرور — نُظم</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../../assets/css/variables.css">
<link rel="stylesheet" href="../../assets/css/design-system.css">
<link rel="stylesheet" href="../../assets/css/components.css">
<link rel="stylesheet" href="../../assets/css/animations.css">
<link rel="stylesheet" href="../../assets/css/auth.css">
</head>
<body>

<div class="auth-shell">

  <div data-include="../../components/auth-brand-panel.html"></div>

  <main class="auth-form-panel">
    <div class="auth-card anim-fade-in-up">

      <div class="auth-mobile-mark">
        <svg width="28" height="28" viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="20" r="17" stroke="var(--border)" stroke-width="2.5"/>
          <path d="M20 3 A17 17 0 0 1 35.4 12.5" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        </svg>
        <div class="auth-brand-mark-name">نُظم</div>
      </div>

      <div class="auth-success">
        <div class="auth-success-orb">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>
        </div>
        <div class="auth-card-title">تم تغيير كلمة المرور بنجاح</div>
        <div class="auth-card-desc" style="margin-bottom:24px;">
          يمكنك الآن تسجيل الدخول باستخدام كلمة المرور الجديدة.
        </div>
        <a href="login.html" class="btn btn-primary" style="width:100%; justify-content:center;">
          تسجيل الدخول
        </a>
      </div>

    </div>
  </main>
</div>

<script type="module" src="../../assets/js/app.js"></script>
</body>
</html>
