<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>إعادة تعيين كلمة المرور — نُظم</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../../assets/css/variables.css">
<link rel="stylesheet" href="../../assets/css/design-system.css">
<link rel="stylesheet" href="../../assets/css/components.css">
<link rel="stylesheet" href="../../assets/css/animations.css">
<link rel="stylesheet" href="../../assets/css/auth.css">
</head>
<body>

<div class="auth-shell">

  <div data-include="../../components/auth-brand-panel.html"></div>

  <main class="auth-form-panel">
    <div class="auth-card anim-fade-in-up">

      <div class="auth-mobile-mark">
        <svg width="28" height="28" viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="20" r="17" stroke="var(--border)" stroke-width="2.5"/>
          <path d="M20 3 A17 17 0 0 1 35.4 12.5" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        </svg>
        <div class="auth-brand-mark-name">نُظم</div>
      </div>

      <!-- ---------- Valid token state (default) ---------- -->
      <div data-reset-valid-state>
        <div class="auth-card-head">
          <div class="auth-card-title">تعيين كلمة مرور جديدة</div>
          <div class="auth-card-desc">اختر كلمة مرور قوية لحسابك في نُظم.</div>
        </div>

        <form class="auth-form" data-reset-form novalidate>
          <div class="field">
            <label for="reset-pw1">كلمة المرور الجديدة</label>
            <input type="password" id="reset-pw1" name="new_password1" placeholder="••••••••" autocomplete="new-password" autofocus>
          </div>
          <div class="pw-strength" data-pw-strength-meter>
            <div class="pw-strength-seg"></div><div class="pw-strength-seg"></div><div class="pw-strength-seg"></div><div class="pw-strength-seg"></div>
          </div>
          <div class="pw-strength-label" data-pw-strength-label style="margin-bottom:16px;">قوة كلمة المرور: —</div>

          <div class="field">
            <label for="reset-pw2">تأكيد كلمة المرور الجديدة</label>
            <input type="password" id="reset-pw2" name="new_password2" placeholder="••••••••" autocomplete="new-password">
          </div>

          <button type="submit" class="btn btn-primary">حفظ كلمة المرور الجديدة</button>
        </form>
      </div>

      <!-- ---------- Invalid/expired token state
           Demo trigger: reset-password.html?invalid=1 (a real backend sets
           this server-side; see auth.js for where this is read) ---------- -->
      <div data-reset-invalid-state class="auth-success" style="display:none;">
        <div class="auth-success-orb" style="background:var(--critical-tint);">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--critical);"><path d="M12 3l8.5 3.5v6c0 5.5-3.6 8.5-8.5 10.5-4.9-2-8.5-5-8.5-10.5v-6L12 3z"/><path d="M12 9v5"/></svg>
        </div>
        <div class="auth-card-title">انتهت صلاحية هذا الرابط</div>
        <div class="auth-card-desc" style="margin-bottom:24px;">
          روابط إعادة تعيين كلمة المرور صالحة لمرة واحدة ولمدة 24 ساعة فقط. اطلب رابطًا جديدًا للمتابعة.
        </div>
        <a href="forgot-password.html" class="btn btn-primary" style="width:100%; justify-content:center;">
          طلب رابط جديد
        </a>
      </div>

    </div>
  </main>
</div>

<script type="module" src="../../assets/js/app.js"></script>
<script type="module" src="../../assets/js/auth.js"></script>
</body>
</html>
