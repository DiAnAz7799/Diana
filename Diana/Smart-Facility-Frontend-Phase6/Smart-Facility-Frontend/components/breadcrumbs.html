<!--
  components/breadcrumbs.html
  Static shell; actual crumb items are rendered by breadcrumbs logic in
  include.js's applyBodyDataHooks() (see assets/js/include.js), reading a
  JSON array from <body data-breadcrumbs='[{"label":"...", "url": null}, ...]'>
  set per page. The last item (current page) should have "url": null.
-->
<div class="breadcrumbs" data-breadcrumbs-container style="display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-faint); margin-bottom:6px;"></div>
