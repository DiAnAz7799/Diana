<!--
  components/navbar.html
  Search placeholder text and identity are populated by JS:
    - <body data-search-placeholder="..."> read by a small inline hook below
    - role identity via [data-role-*] attributes, populated by sidebar.js
-->
<div class="topbar">
  <button class="btn-icon" style="display:none;" data-sidebar-mobile-toggle aria-label="فتح القائمة">
    <svg class="gi" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>

  <div class="topbar-search" data-search-trigger role="button" tabindex="0">
    <svg class="gi" width="16" height="16" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.5-4.5"/></svg>
    <span class="placeholder-label" data-search-placeholder-label>ابحث في النظام… (Ctrl+K)</span>
  </div>

  <div class="top-actions" style="display:flex; align-items:center; gap:14px;">

    <button class="btn-icon" data-notif-toggle aria-label="الإشعارات" style="position:relative;">
      <svg class="gi" width="18" height="18" viewBox="0 0 24 24"><path d="M6 10a6 6 0 0 1 12 0v4l2 3H4l2-3v-4z"/><path d="M10 20a2.2 2.2 0 0 0 4 0" stroke="var(--babyblue)"/></svg>
      <span class="dot" data-notif-dot style="position:absolute; top:6px; left:6px; width:8px; height:8px; border-radius:50%; background:var(--critical); border:2px solid var(--surface);"></span>
    </button>

    <button class="btn-icon" aria-label="الرسائل">
      <svg class="gi" width="18" height="18" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M4 6.5l8 6.5 8-6.5" stroke="var(--babyblue)"/></svg>
    </button>

    <div class="dropdown">
      <div class="profile" data-dropdown-trigger style="display:flex; align-items:center; gap:10px; cursor:pointer;">
        <div>
          <div data-role-name style="font-size:13px; font-weight:700;">—</div>
          <div data-role-label-short style="font-size:11px; color:var(--text-muted);">—</div>
        </div>
        <div class="avatar" data-role-avatar style="width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,var(--primary),var(--accent)); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:13px;">—</div>
      </div>
      <div class="dropdown-menu">
        <a href="../shared/profile.html" class="dropdown-item">
          <svg class="gi" width="15" height="15" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c.6-4 2.7-6 5.5-6s4.9 2 5.5 6"/></svg>
          الملف الشخصي
        </a>
        <a href="../shared/help.html" class="dropdown-item">
          <svg class="gi" width="15" height="15" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .8-1 1.7v.5M12 17v.01"/></svg>
          مركز المساعدة
        </a>
        <div class="dropdown-divider"></div>
        <a href="../authentication/login.html" class="dropdown-item is-danger">
          <svg class="gi" width="15" height="15" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
          تسجيل الخروج
        </a>
      </div>
    </div>

  </div>
</div>

<style>
  @media (max-width: 900px){ [data-sidebar-mobile-toggle]{ display: flex !important; } }
</style>
